<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delaunay Art Generator</title>
  <script type="module" crossorigin src="/assets/index-Dam1zPCH.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D68O2OIL.css">
</head>
<body>
    <nav>
        <a href="index.html" class="active">Delaunay Generator</a>
        <a href="decomposer.html">Color Decomposer</a>
    </nav>
    <div class="app-container" id="appContainer">
        <div class="output-window">
            <div id="paneOriginal" class="svg-pane"><img id="originalImagePreview" style="cursor: pointer;" /></div>
            <div id="paneDelaunay" class="svg-pane active"><canvas id="outputCanvas" style="cursor: pointer;" title="Click and hold to view original image"></canvas></div>
            <div id="status">Processing...</div>
        </div>
        
        <input type="file" id="imageFile" accept="image/*">
        
        <div class="controls-bar" style="flex-wrap: wrap; gap: 15px;">
            <div class="dropdown">
                <button class="control-button" id="uploadMenuBtn" title="Select Image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <div id="uploadDropdown" class="dropdown-content">
                    <a href="#" data-val="public/Mona_Lisa.png">Mona Lisa</a>
                    <a href="#" data-val="public/Marilyn_Monroe.jpg">Marilyn Monroe</a>
                    <a href="#" data-val="custom">📁 Upload custom...</a>
                </div>
            </div>

            <div class="control-group" style="display: flex; gap: 20px; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 8px; align-items: center;">
                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <label for="seedsSlider" style="font-size: 0.75rem; font-weight: bold; color: #aaa; margin-bottom: 4px;">Initial Seeds</label>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <input type="range" id="seedsSlider" min="100" max="2000" value="333" step="1" style="width: 80px;">
                        <input type="number" id="seedsInput" value="333" min="100" max="2000" style="width: 45px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 2px; text-align: center; font-size: 0.8rem;">
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <div style="display: flex; align-items: center; margin-bottom: 4px;">
                        <label id="edgeLabelMain" style="font-size: 0.75rem; font-weight: bold; color: #aaa; transition: 0.3s;">Contrast vs Dark</label>
                        <label class="switch" title="Reverse Mode">
                            <input type="checkbox" id="reverseToggle">
                            <span class="slider-toggle"></span>
                        </label>
                    </div>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span id="edgeLabelSub" style="font-size: 0.7rem; color: #888; min-width: 25px; transition: 0.3s;">Dark</span>
                        <input type="range" id="edgeSlider" min="0" max="100" value="62" step="1" style="width: 80px;">
                        <div style="display: flex; align-items: center; gap: 2px;">
                            <input type="number" id="edgeInput" value="62" min="0" max="100" style="width: 40px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 2px; text-align: center; font-size: 0.8rem;">
                            <span style="font-size: 0.75rem; color: #888;">%</span>
                        </div>
                    </div>
                </div>
            </div>

            <button class="control-button" id="processButton" title="Process" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            
            <button class="control-button" id="downloadSVGButton" title="Download SVG" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
        </div>
    </div>
    <div id="sourceCanvasContainer"><canvas id="sourceCanvas"></canvas></div>

</body>
</html>
