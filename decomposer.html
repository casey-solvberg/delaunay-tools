<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Decomposer (Advanced)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Delaunay Generator</a>
        <a href="decomposer.html" class="active">Color Decomposer</a>
    </nav>
    
    <div class="app-container" id="appContainer">
        <div class="output-window" id="outputWindow" style="cursor: pointer;" title="Click and hold to view original image">
            <div id="paneOriginal" class="svg-pane"><img id="originalImagePreview" style="max-width: 100%; max-height: 100%; object-fit: contain;" /></div>
            <div id="paneDecomposed" class="svg-pane active"><canvas id="outputCanvas"></canvas></div>
            <div id="status">Processing...</div>
        </div>
        
        <input type="file" id="imageFile" accept="image/*">
        
        <div class="controls-bar" style="flex-wrap: wrap; gap: 15px;">
            <div class="dropdown">
                <button class="control-button" id="uploadMenuBtn" title="Select Image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <div id="uploadDropdown" class="dropdown-content">
                    <a href="#" data-val="Mona_Lisa.png">Mona Lisa</a>
                    <a href="#" data-val="Marilyn_Monroe.jpg">Marilyn Monroe</a>
                    <a href="#" data-val="custom">📁 Upload custom...</a>
                </div>
            </div>

            <div class="control-group" style="display: flex; gap: 15px; background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 8px; flex-wrap: wrap; justify-content: center; align-items: center;">
                
                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <label for="seedsSlider" style="font-size: 0.75rem; font-weight: bold; color: #aaa; margin-bottom: 4px;">Initial Seeds</label>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <input type="range" id="seedsSlider" min="100" max="2000" value="333" step="1" style="width: 70px;">
                        <input type="number" id="seedsInput" value="333" min="100" max="2000" style="width: 45px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 2px; text-align: center; font-size: 0.8rem;">
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; justify-content: center;">
                    <label for="edgeSlider" style="font-size: 0.75rem; font-weight: bold; color: #aaa; margin-bottom: 4px;">Contrast vs Dark</label>
                    <div style="display: flex; align-items: center; gap: 4px;">
                        <span style="font-size: 0.7rem; color: #888;">Dark</span>
                        <input type="range" id="edgeSlider" min="0" max="100" value="62" step="1" style="width: 70px;">
                        <div style="display: flex; align-items: center; gap: 2px;">
                            <input type="number" id="edgeInput" value="62" min="0" max="100" style="width: 40px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 2px; text-align: center; font-size: 0.8rem;">
                            <span style="font-size: 0.75rem; color: #888;">%</span>
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; align-items: center; border-left: 1px solid #444; padding-left: 15px; gap: 10px; height: 100%;">
                    <div style="display: flex; flex-direction: column; justify-content: center;">
                        <label for="hueSlider" style="font-size: 0.75rem; font-weight: bold; color: #aaa; margin-bottom: 4px;">Hue Matrix Shift</label>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <input type="range" id="hueSlider" min="-180" max="180" value="0" step="1" style="width: 70px;">
                            <div style="display: flex; align-items: center; gap: 2px;">
                                <input type="number" id="hueInput" value="0" style="width: 45px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 2px; text-align: center; font-size: 0.8rem;">
                                <span style="font-size: 0.75rem; color: #888;">°</span>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 4px; height: 36px; margin-top: 2px;">
                        <div id="paletteCMYK" style="display: flex; flex-direction: column; width: 14px; gap: 1px; border: 1px solid #222; border-radius: 2px; overflow: hidden; background: #000;"></div>
                        <div id="paletteRGB" style="display: flex; flex-direction: column; width: 14px; gap: 1px; border: 1px solid #222; border-radius: 2px; overflow: hidden; background: #000;"></div>
                    </div>
                </div>

            </div>

            <button class="control-button" id="processButton" title="Process" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>

            <button class="control-button" id="downloadSVGButton" title="Download SVG" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
        </div>
    </div>
    <div id="sourceCanvasContainer"><canvas id="sourceCanvas"></canvas></div>

<script type="module">
    import { Delaunay } from 'https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/+esm';
    import { getPixelColor, shiftHue, PRIMITIVE_COLORS_RGB } from './src/core/color.js';
    import { generateSeeds, addBoundarySeeds } from './src/core/seeds.js';
    import { Decomposer } from './src/core/decomposer.js';

    const imageFileEl = document.getElementById('imageFile');
    const uploadMenuBtn = document.getElementById('uploadMenuBtn');
    const uploadDropdown = document.getElementById('uploadDropdown');
    const processButton = document.getElementById('processButton');
    const downloadSVGButtonEl = document.getElementById('downloadSVGButton');
    const statusEl = document.getElementById('status');
    const sourceCanvas = document.getElementById('sourceCanvas');
    const sourceCtx = sourceCanvas.getContext('2d', { willReadFrequently: true });
    const outputCanvas = document.getElementById('outputCanvas');
    const outputCtx = outputCanvas.getContext('2d');
    const originalImagePreview = document.getElementById('originalImagePreview');
    
    const seedsSlider = document.getElementById('seedsSlider');
    const seedsInput = document.getElementById('seedsInput');
    const edgeSlider = document.getElementById('edgeSlider');
    const edgeInput = document.getElementById('edgeInput');
    const hueSlider = document.getElementById('hueSlider');
    const hueInput = document.getElementById('hueInput');

    const paletteCMYK = document.getElementById('paletteCMYK');
    const paletteRGB = document.getElementById('paletteRGB');

    const paneOriginal = document.getElementById('paneOriginal');
    const paneDecomposed = document.getElementById('paneDecomposed');
    const outputWindow = document.getElementById('outputWindow');

    let originalImageData = null;
    let imageWidth = 0; let imageHeight = 0;
    let processing = false; 
    let currentFinalPolygons = null;
    let currentFileName = 'decomposed_art';
    let cachedDelaunay = null;
    let cachedPointsForDelaunay = null;

    seedsSlider.addEventListener('input', (e) => { seedsInput.value = e.target.value; });
    seedsInput.addEventListener('change', (e) => {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val) || val < 100) val = 100; if (val > 2000) val = 2000;
        e.target.value = val; seedsSlider.value = val;
    });

    edgeSlider.addEventListener('input', (e) => { edgeInput.value = e.target.value; });
    edgeInput.addEventListener('change', (e) => {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) val = 62; if (val < 0) val = 0; if (val > 100) val = 100;
        e.target.value = val; edgeSlider.value = val;
    });
    
    hueSlider.addEventListener('input', (e) => {
        hueInput.value = e.target.value;
        updateDynamicPalette();
        if (cachedDelaunay && !processing) applyHueShiftFast(); 
    });
    
    hueInput.addEventListener('change', (e) => {
        let val = parseInt(e.target.value, 10);
        if (isNaN(val)) val = 0;
        while (val > 180) val -= 360;
        while (val < -180) val += 360;
        if (val === -180) val = 180;
        e.target.value = val; 
        hueSlider.value = val;
        updateDynamicPalette();
        if (cachedDelaunay && !processing) applyHueShiftFast();
    });

    const colorsCMYK = ['cyan', 'magenta', 'yellow', 'black'];
    const colorsRGB = ['red', 'green', 'blue'];

    function initPalette() {
        colorsCMYK.forEach(color => {
            const div = document.createElement('div'); div.style.flex = "1"; div.dataset.key = color;
            paletteCMYK.appendChild(div);
        });
        colorsRGB.forEach(color => {
            const div = document.createElement('div'); div.style.flex = "1"; div.dataset.key = color;
            paletteRGB.appendChild(div);
        });
        updateDynamicPalette();
    }

    function updateDynamicPalette() {
        const shiftX = parseInt(hueInput.value, 10);
        const updateContainer = (container) => {
            Array.from(container.children).forEach(div => {
                const baseRGB = PRIMITIVE_COLORS_RGB[div.dataset.key];
                let renderRGB = baseRGB;
                if (div.dataset.key !== 'black' && div.dataset.key !== 'white') {
                    renderRGB = shiftHue(baseRGB[0], baseRGB[1], baseRGB[2], -shiftX);
                }
                div.style.backgroundColor = `rgb(${renderRGB[0]}, ${renderRGB[1]}, ${renderRGB[2]})`;
            });
        };
        updateContainer(paletteCMYK);
        updateContainer(paletteRGB);
    }

    outputWindow.addEventListener('mousedown', () => { if(currentFinalPolygons) { paneDecomposed.classList.remove('active'); paneOriginal.classList.add('active'); }});
    window.addEventListener('mouseup', () => { if(currentFinalPolygons) { paneOriginal.classList.remove('active'); paneDecomposed.classList.add('active'); }});
    outputWindow.addEventListener('touchstart', () => { if(currentFinalPolygons) { paneDecomposed.classList.remove('active'); paneOriginal.classList.add('active'); }});
    window.addEventListener('touchend', () => { if(currentFinalPolygons) { paneOriginal.classList.remove('active'); paneDecomposed.classList.add('active'); }});

    const baseSettings = { numBoundarySeeds: 11, powerFactor: 0.1, edgeThreshold: 33, minDistance: 18, imageWidth: 1024, imageHeight: 1536 };

    function showStatus(text) { statusEl.textContent = text ? text : ''; statusEl.style.display = text ? 'block' : 'none'; }

    uploadMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); uploadDropdown.classList.toggle('show'); });
    window.addEventListener('click', (e) => { if (!uploadMenuBtn.contains(e.target)) uploadDropdown.classList.remove('show'); });
    uploadDropdown.querySelectorAll('a').forEach(a => {
        a.addEventListener('click', (e) => {
            e.preventDefault(); uploadDropdown.classList.remove('show');
            const val = e.target.getAttribute('data-val');
            if (val === 'custom') imageFileEl.click(); else loadExample(val);
        });
    });

    processButton.addEventListener('click', () => { if (originalImageData && !processing) generateGridAndProcess(); });
    downloadSVGButtonEl.addEventListener('click', () => { if (currentFinalPolygons && !processing) downloadSVG(); });
    
    imageFileEl.addEventListener('change', (e) => {
        const file = e.target.files[0]; if (!file) return;
        currentFileName = file.name.split('.')[0]; loadImageFromFile(file);
    });

    document.addEventListener('DOMContentLoaded', () => { 
        initPalette();
        loadExample('Mona_Lisa.png'); 
    });

    function updateButtonState(imageLoaded, imageProcessed = false) {
        processButton.disabled = !imageLoaded || processing; downloadSVGButtonEl.disabled = !imageProcessed || processing;
        seedsSlider.disabled = processing; seedsInput.disabled = processing; 
        edgeSlider.disabled = processing; edgeInput.disabled = processing;
        hueSlider.disabled = processing; hueInput.disabled = processing;
    }

    function loadExample(url) {
        processing = true; currentFinalPolygons = null; updateButtonState(false, false); showStatus('Loading...');
        currentFileName = url.split('/').pop().split('.')[0];
        const img = new Image(); img.crossOrigin = "Anonymous";
        img.onload = () => {
            imageWidth = img.width; imageHeight = img.height;
            sourceCanvas.width = imageWidth; sourceCanvas.height = imageHeight;
            sourceCtx.drawImage(img, 0, 0); originalImageData = sourceCtx.getImageData(0, 0, imageWidth, imageHeight);
            originalImagePreview.src = img.src; processing = false; generateGridAndProcess(); 
        };
        img.onerror = () => { showStatus('Error loading.'); processing = false; updateButtonState(false); };
        img.src = url;
    }

    function loadImageFromFile(file) {
        processing = true; currentFinalPolygons = null; updateButtonState(false, false); showStatus('Loading...');
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                imageWidth = img.width; imageHeight = img.height;
                sourceCanvas.width = imageWidth; sourceCanvas.height = imageHeight;
                sourceCtx.drawImage(img, 0, 0); originalImageData = sourceCtx.getImageData(0, 0, imageWidth, imageHeight);
                originalImagePreview.src = img.src; processing = false; generateGridAndProcess();
            }
            img.onerror = () => { showStatus('Error.'); processing = false; updateButtonState(false); }
            img.src = e.target.result;
        }
        reader.onerror = () => { showStatus('Error.'); processing = false; updateButtonState(false); }
        reader.readAsDataURL(file);
    }

    async function generateGridAndProcess() {
        if (!originalImageData) return;
        processing = true; updateButtonState(true, false); showStatus('Processing...'); void outputCanvas.offsetWidth;
        await new Promise(r => setTimeout(r, 50));

        const userNumSeeds = parseInt(seedsInput.value, 10);
        const userEdgeWeightFactor = parseInt(edgeInput.value, 10) / 100.0;

        const cArea = imageWidth * imageHeight; const bArea = baseSettings.imageWidth * baseSettings.imageHeight;
        let aScale = Math.max(0.1, Math.min(10.0, (bArea > 0 && cArea > 0) ? (cArea / bArea) : 1.0));
        let lScale = Math.max(0.25, Math.min(4.0, (Math.min(baseSettings.imageWidth, baseSettings.imageHeight) > 0) ? (Math.min(imageWidth, imageHeight) / Math.min(baseSettings.imageWidth, baseSettings.imageHeight)) : 1.0));

        const numSeeds = Math.max(100, Math.round(userNumSeeds * aScale));
        const numBSeeds = Math.max(5, Math.round(baseSettings.numBoundarySeeds * lScale));
        const minD = Math.max(1, Math.round(baseSettings.minDistance * lScale));

        let seeds = generateSeeds(numSeeds, baseSettings.powerFactor, baseSettings.edgeThreshold, userEdgeWeightFactor, minD, imageWidth, imageHeight, originalImageData);
        seeds = addBoundarySeeds(seeds, imageWidth, imageHeight, numBSeeds);
        
        cachedPointsForDelaunay = seeds.map(s => [s[0], s[1]]);
        cachedDelaunay = Delaunay.from(cachedPointsForDelaunay);

        applyHueShiftFast();

        processing = false; updateButtonState(true, true); showStatus(null); 
    }

    function applyHueShiftFast() {
        if (!cachedDelaunay || !cachedPointsForDelaunay) return;

        const shiftX = parseInt(hueInput.value, 10);
        const decomposer = new Decomposer();
        
        for (let i = 0; i < cachedDelaunay.triangles.length; i += 3) {
            const p1 = cachedPointsForDelaunay[cachedDelaunay.triangles[i]];
            const p2 = cachedPointsForDelaunay[cachedDelaunay.triangles[i+1]];
            const p3 = cachedPointsForDelaunay[cachedDelaunay.triangles[i+2]];
            if (!p1 || !p2 || !p3) continue;
            
            const col = getPixelColor(originalImageData, (p1[0]+p2[0]+p3[0])/3, (p1[1]+p2[1]+p3[1])/3);
            const shiftedColor = shiftHue(col.r, col.g, col.b, shiftX);
            decomposer.decompose(p1, p2, p3, shiftedColor[0], shiftedColor[1], shiftedColor[2]);
        }

        outputCanvas.width = imageWidth; outputCanvas.height = imageHeight;
        outputCtx.clearRect(0, 0, imageWidth, imageHeight);
        outputCtx.fillStyle = "#111"; outputCtx.fillRect(0, 0, imageWidth, imageHeight);

        currentFinalPolygons = decomposer.polygons;

        for (const poly of decomposer.polygons) {
            const baseRGB = PRIMITIVE_COLORS_RGB[poly.colorKey];
            let renderRGB = baseRGB;
            
            if (poly.colorKey !== 'black' && poly.colorKey !== 'white') {
                renderRGB = shiftHue(baseRGB[0], baseRGB[1], baseRGB[2], -shiftX);
            }

            outputCtx.beginPath();
            outputCtx.moveTo(poly.vertices[0][0], poly.vertices[0][1]);
            for(let v=1; v<poly.vertices.length; v++) outputCtx.lineTo(poly.vertices[v][0], poly.vertices[v][1]);
            outputCtx.closePath();

            outputCtx.fillStyle = `rgb(${renderRGB[0]}, ${renderRGB[1]}, ${renderRGB[2]})`;
            outputCtx.fill();
            outputCtx.strokeStyle = `rgba(${renderRGB[0]}, ${renderRGB[1]}, ${renderRGB[2]}, 0.5)`;
            outputCtx.lineWidth = 0.5; outputCtx.stroke();
        }
    }

    function generateSVGString() {
        if (!currentFinalPolygons || !originalImageData) return null;
        const shiftX = parseInt(hueInput.value, 10);
        let svgString = `<svg width="${imageWidth}" height="${imageHeight}" viewBox="0 0 ${imageWidth} ${imageHeight}" xmlns="http://www.w3.org/2000/svg" style="background-color: #111;">\n`;
        
        for (const poly of currentFinalPolygons) {
            const baseRGB = PRIMITIVE_COLORS_RGB[poly.colorKey];
            let renderRGB = baseRGB;
            if (poly.colorKey !== 'black' && poly.colorKey !== 'white') {
                renderRGB = shiftHue(baseRGB[0], baseRGB[1], baseRGB[2], -shiftX);
            }
            const pts = poly.vertices.map(p => `${p[0].toFixed(2)},${p[1].toFixed(2)}`).join(" ");
            const col = `rgb(${renderRGB[0]},${renderRGB[1]},${renderRGB[2]})`;
            svgString += `  <polygon points="${pts}" fill="${col}" stroke="${col}" stroke-width="0.3" />\n`;
        }
        return svgString + `</svg>`;
    }

    function downloadSVG() {
        const svgData = generateSVGString();
        if (svgData) {
            const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url;
            a.download = `${currentFileName}_seeds${seedsInput.value}_edge${edgeInput.value}_hue${hueInput.value}.svg`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }
    }
</script>
</body>
</html>
